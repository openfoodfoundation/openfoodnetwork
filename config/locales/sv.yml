        tag_rule_help:
          title: Regler för etiketter
          overview: Översikt
          overview_text: >
              Etikettreglerna är ett sätt att beskriva vilka varor visas eller inte
              för olika kunder. Reglerna kan beröra leveransmetoder, betalningssätt,
              produkt- eller beställningsomgångar.
          by_default_rules: "Regler för standard "
          by_default_rules_text: >
              Standardreglerna tillåter dig att dölja varor så att de ej visas som
              standard. Denna metod kan sedan upphävas av en "ej-standard" regel för
              de kunder som har särskilda etiketter.
          customer_tagged_rules: "Regler för kundetiketter"
          customer_tagged_rules_text: >
              Genom att skapa regler för en speciell kundetikett kan du upphäva standardförfarandet
              (vare sig det är att visa eller dölja varor) för kunder med den specifika
              etiketten.
        terms_and_conditions_info:
          title: "Regler och villkor för uppladdning"
          message_1: "Regler och villkor är avtalet mellan dig, säljaren och köparen. Om du laddar upp en fil här måste köpare acceptera dina villkor för att kunna slutföra kassan. För shopparen kommer detta att visas som en kryssruta i kassan som måste vara markerad för att fortsätta med kassan. Vi rekommenderar starkt att du laddar upp användarvillkor i linje med nationell lagstiftning."
          message_2: "Köpare kommer endast att behöva acceptera villkoren en gång. Men om du ändrar dina villkor måste kunderna återigen acceptera dem innan de kan gå till kassan."
        terms_and_conditions_warning:
          title: "Regler och villkor för uppladdning"
          message_1: "Alla dina köpare måste godkänna dem en gång i kassan. Om du uppdaterar filen måste alla dina köpare gå med på dem igen i kassan."
          message_2: "För köpare med prenumerationer måste du mejla dem villkoren (eller ändringarna av dem) för nu, ingenting kommer att meddela dem om dessa nya villkor."
        business_address_info:
          message: "Företagets juridiska namn, juridiska adress och juridiska telefonnummer används för företag som fakturerar från en juridisk person som är registrerad med andra uppgifter till deras offentliga handelsinformation. Dessa uppgifter kommer ENDAST att användas på fakturor. Om dessa uppgifter är tomma kommer ditt offentliga namn, adress och telefonnummer att användas på fakturor."
      panels:
