        enterprise_package:
          hub_profile: Hubbprofil
          hub_profile_cost: "KOSTNAD: ALLTID GRATIS"
          hub_profile_text1: >
              Folk kan finna och kontakta dig på OFN. Ditt företag visas på en karta
              och går att söka på i olika listor.
          hub_profile_text2: >
              Att ha en profil samt ha förbindelser inom ditt lokala livsmedelssystem
              via OFN  är alltid gratis.
          hub_shop: Hubbutik
          hub_shop_text1: >
              hej
          hub_shop_text2: >-
              Hubbar kan ha många former, till exempel livsmedelskooperativ, inköpsgrupper,
              grönsakslådeprogram eller lokala livsmedelsbutiker.
          hub_shop_text3: >
              Om du också önskar att sälja dina egna produkter måste du ändra detta
              företag till att vara en producent.
          choose_package: Var vänlig välj en förpackning
          choose_package_text1: >
              Ditt företag kommer inte att var aktiverat förrän du valt förpackning
              från listan till vänster.
          choose_package_text2: >-
              Klicka på ett alternativ för mer information om varje paket. Klicka
              på den röda knappen SPARA när du är klar!
          profile_only: Enbart profil
          profile_only_cost: "KOSTNAD: ALLTID GRATIS"
          profile_only_text1: >
              En profil gör att du blir synlig och kan kontaktas av andra och är ett
              sätt att berätta din historia.
          profile_only_text2: >
              Om du föredrar att fokusera på att framställa mat och vill slippa arbetet
              med försäljning till andra, behöver du inte en affär i OFN.
          profile_only_text3: >-
              Lägg till dina produkter i Open Food Network så att hubbar kan lagerföra
              dem i sina butiker.
          producer_shop: Producentaffär
          producer_shop_text1: >
              Sälj dina produkter direkt till kunder genom ditt alldeles egna OFN
              skyltfönster.
          producer_shop_text2: >-
              En producentbutik är endast avsedd för dina egna produkter. Välj ”Producenthubb”
              om du även vill sälja produkter som odlas eller produceras av andra.
          producer_hub: Producenthubb
          producer_hub_text1: >
              Ditt företag är grunden i ditt lokala livsmedelssystem. Du kan sälja
              dina egna såväl som produkter inköpta från andra företag genom ditt
              skyltfönster på OFN.
          producer_hub_text2: >-
              Producenthubbar kan ha många former, till exempel andelsjordbruk (CSA),
              grönsakslådeprogram eller kooperativ med takodlingar.
          producer_hub_text3: >-
              Open Food Network vill stödja så många hubbmodeller som möjligt och
              ge dig verktygen du behöver för att driva din organisation eller lokala
              livsmedelsverksamhet.
