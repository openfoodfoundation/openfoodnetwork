  legal:
    cookies_policy:
      header: "Hur vi använder cookies"
      desc_part_1: "Cookies är mycket små textfiler som lagras på din dator när du besöker vissa webbplatser."
      desc_part_2: "I OFN respekterar vi din integritet fullt ut. Vi använder endast de cookies som är nödvändiga för att ge dig tjänsten att sälja/köpa mat online. Vi säljer ingen av dina uppgifter. Vi kan i framtiden föreslå dig att dela en del av dina data för att bygga nya commons-tjänster som kan vara användbara för ekosystemet (som logistiktjänster för korta livsmedelssystem) men vi är inte där än och vi kommer inte att göra det utan ditt tillstånd :-)"
      desc_part_3: "Vi använder cookies främst för att komma ihåg vem du är om du \"loggar in\" på tjänsten, eller för att kunna komma ihåg varorna du lagt i din varukorg även om du inte är inloggad. Om du fortsätter att navigera på webbplatsen utan att klicka på \"Acceptera cookies\" antar vi att du ger oss samtycke till att lagra de cookies som är nödvändiga för att webbplatsen ska fungera. Här är listan över cookies vi använder!"
      essential_cookies: "Viktiga kakor"
      essential_cookies_desc: "Följande cookies är absolut nödvändiga för driften av vår webbplats."
      essential_cookies_note: "De flesta cookies innehåller bara en unik identifierare, men ingen annan data, så din mejladress och ditt lösenord finns till exempel aldrig i dem och exponeras aldrig."
      cookie_domain: "Sätts av:"
      cookie_session_desc: "Används för att tillåta webbplatsen att komma ihåg användare mellan sidbesök, till exempel komma ihåg varor i din kundvagn."
      cookie_remember_me_desc: "Används om användaren har begärt att webbplatsen ska komma ihåg honom. Denna cookie raderas automatiskt efter 12 dagar. Om du som användare vill att kakan ska raderas behöver du bara logga ut. Om du inte vill att den cookien ska installeras på din dator ska du inte markera kryssrutan \"kom ihåg mig\" när du loggar in."
      cookie_openstreemap_desc: "Används av vår vänliga kartläggningsleverantör med öppen källkod (OpenStreetMap) för att säkerställa att den inte tar emot för många förfrågningar under en given tidsperiod, för att förhindra missbruk av deras tjänster."
      cookie_stripe_desc: "Data som samlas in av vår betalningsprocessor Stripe för att upptäcka bedrägerier https://stripe.com/cookies-policy/legal. Alla butiker använder inte Stripe som betalningsmetod men det är en god praxis att förhindra bedrägeri att tillämpa det på alla sidor. Stripe bygger förmodligen en bild av vilka av våra sidor som vanligtvis interagerar med deras API och flaggar sedan något ovanligt. Så att ställa in Stripe-cookien har en bredare funktion än att bara tillhandahålla en betalningsmetod till en användare. Att ta bort det kan påverka säkerheten för själva tjänsten. Du kan lära dig mer om Stripe och läsa dess sekretesspolicy på https://stripe.com/privacy."
      statistics_cookies: "Statistikkakor"
      statistics_cookies_desc: "Följande är inte strikt nödvändiga, men hjälper till att ge dig den bästa användarupplevelsen genom att tillåta oss att analysera användarbeteende, identifiera vilka funktioner du använder mest, eller inte använder, förstå problem med användarupplevelsen, etc."
      statistics_cookies_matomo_desc_html: "För att samla in och analysera plattformsanvändningsdata använder vi <a href='https://matomo.org/' target='_blank'>Matomo</a> (ex Piwik), ett analysverktyg med öppen källkod som är GDPR-kompatibelt och skyddar din integritet."
      statistics_cookies_matomo_optout: "Vill du välja bort Matomo-analys? Vi samlar inte in några personuppgifter. Matomo hjälper oss att förbättra tjänsten, men vi respekterar ditt val :-)"
      cookie_matomo_basics_desc: "Matomo förstapartscookies för att samla in statistik."
      cookie_matomo_heatmap_desc: "Cookie för Matomos värmekartor och sessionsinspelning."
      cookie_matomo_ignore_desc: "Cookie används för att utesluta användare från att spåras."
      disabling_cookies_header: "Varning om att inaktivera cookies"
      disabling_cookies_desc: "Som användare kan du alltid tillåta, blockera eller radera Open Food Networks eller andra webbplatscookies när du vill via din webbläsares inställningskontroll. Varje webbläsare har olika funktioner. Här är länkarna:"
      disabling_cookies_firefox_link: "https://support.mozilla.org/en-US/kb/enable-and-disable-cookies-website-preferences"
      disabling_cookies_chrome_link: "https://support.google.com/chrome/answer/95647"
      disabling_cookies_ie_link: "https://support.microsoft.com/en-us/help/17442/windows-internet-explorer-delete-manage-cookies"
      disabling_cookies_safari_link: "https://www.apple.com/legal/privacy/en-ww/cookies/"
      disabling_cookies_note: "Men tänk på att om du tar bort eller ändrar de viktiga cookies som används av Open Food Network, kommer webbplatsen inte att fungera, du kommer inte att kunna lägga till något i din varukorg, varken i kassan till exempel."
  home_shop: Handla nu
  brandstory_headline: "Mat, icke-inkorporerad."
  brandstory_intro: "Ibland är det bästa sättet att fixa till systemet att starta ett nytt..."
  brandstory_part1: "Vi bygger från grunden. Med odlare och producenter som berättar om sina företag ärligt och uppriktigt. Med distributörer som önskar koppla ihop köpare med produkter på ett bra sätt. Med konsumenter, som tror att bättre veckoinköp kan skapa en förändring av världen."
  brandstory_part2: "Sedan behöver vi ett sätt att förverkliga vår idé. Ett sätt att stärka var och en som odlar, säljer och köper mat. Ett sätt att berätta om alla möjligheter, att hantera logistiken. "
  brandstory_part3: "Så vi bygger en marknadsplats på nätet som är likvärdig med dagligvaruhandeln. Den är klar och tydlig så den skapar relationer. Den är en öppen källa så den ägs av alla. Den passar både regioner och nationer så folk startar versioner över hela världen. "
  brandstory_part4: "Det fungerar överallt. Det förändrar alltihop."
  brandstory_part5_strong: "Vi kallar det Open Food Network."
  brandstory_part6: "Vi alla älskar mat. Nu kan vi älska vårt matsystem också."
