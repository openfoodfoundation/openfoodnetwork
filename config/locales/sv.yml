    not_found:
      title: "Sidan du letade efter finns inte (404)"
      message_html: "<b>Försök igen</b> <p>Detta kan vara ett tillfälligt problem. Klicka på bakåtknappen för att återgå till föregående skärm eller gå tillbaka till <a href='/'>Hem</a> och försök igen.</p> <b>Kontakta support</b> <p>Om problemet kvarstår eller är brådskande, vänligen berätta för oss om det. Hitta våra kontaktuppgifter från den globala sidan <a href='https://openfoodnetwork.org/ofn-local/' target='blank'>Open Food Network Local</a>.</p> <p>Det hjälper oss verkligen om du kan ge så mycket information som möjligt om vad den saknade sidan handlar om.</p>"
    internal_server_error:
      title: "Vi är ledsna, men något gick fel (500)"
      message_html: "<b>Försök igen</b> <p>Detta kan vara ett tillfälligt problem. Klicka på bakåtknappen för att återgå till föregående skärm eller gå tillbaka till <a href='/''>Hem</a> och försök igen.</p> <b>Vi är på gång</b> <p>Om du har sett det här problemet tidigare känner vi förmodligen redan till det och arbetar på att åtgärda det. Vi registrerar alla fel som dyker upp.</p> <b>Kontakta support</b> <p>Om problemet kvarstår eller är brådskande, vänligen berätta om det. Hitta våra kontaktuppgifter från den globala sidan <a href='https://openfoodnetwork.org/ofn-local/' target='blank'>Open Food Network Local</a>.</p> <p>Det hjälper oss verkligen om du kan ge så mycket information som möjligt om vad du gjorde när det här felet inträffade.</p>"
    unprocessable_entity:
      title: "Ändringen du ville ha avvisades (422)"
      message_html: "<p>Ändringen du ville ha avvisades. Kanske har du försökt ändra något du inte har tillgång till. <br><h3><a href='/' >Återvänd hem</a></h3> </p>"
    general_error:
      message: "Vi är ledsna, men något gick fel.\n\nDetta kan vara ett tillfälligt problem, så försök igen eller ladda om sidan.\nVi registrerar alla fel och kanske arbetar med en åtgärd.\nOm problemet kvarstår eller är akut, vänligen kontakta oss."
    unauthorized:
      message: "Du är inte behörig att utföra den åtgärden."
    network_error:
      message: "Nätverksfel: försök igen senare."
