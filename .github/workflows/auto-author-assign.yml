name: Auto Author Assign

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest

    if: github.event.pull_request.assignees == null || github.event.pull_request.assignees[0] == null
    steps:
      - uses: toshimaru/auto-author-assign@v3.0.2
