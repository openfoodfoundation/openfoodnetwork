---
openapi: 3.0.1
info:
  title: API V1
  version: v1
components:
  schemas:
    error_response:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              detail:
                type: string
              source:
                type: object
            required:
            - detail
      required:
      - errors
    customer:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              example: '1'
            type:
              type: string
              example: customer
            attributes:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                enterprise_id:
                  type: integer
                  example: 2
                first_name:
                  type: string
                  nullable: true
                  example: Alice
                last_name:
                  type: string
                  nullable: true
                  example: Springs
                code:
                  type: string
                  nullable: true
                  example: BUYER1
                email:
                  type: string
                  example: alice@example.com
                allow_charges:
                  type: boolean
                  example: false
                tags:
                  type: array
                  items:
                    type: string
                  example:
                  - staff
                  - discount
                terms_and_conditions_accepted_at:
                  type: string
                  format: date-time
                  nullable: true
                  example: '2022-03-12T15:55:00.000+11:00'
                billing_address:
                  type: object
                  nullable: true
                  example:
                shipping_address:
                  type: object
                  nullable: true
                  example:
                    phone: 0404 333 222 111
                    latitude: -37.8173751
                    longitude: 144.964803195704
                    first_name: Alice
                    last_name: Springs
                    street_address_1: 1 Flinders Street
                    street_address_2: ''
                    postal_code: '1234'
                    locality: Melbourne
                    region:
                      code: Vic
                      name: Victoria
                    country:
                      code: AU
                      name: Australia
              required:
              - id
              - enterprise_id
              - first_name
              - last_name
              - code
              - email
              - allow_charges
              - tags
              - terms_and_conditions_accepted_at
              - billing_address
              - shipping_address
            relationships:
              type: object
              properties:
                enterprise:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          example: enterprise
                    links:
                      type: object
                      properties:
                        related:
                          type: string
        meta:
          type: object
        links:
          type: object
      required:
      - data
    customers_collection:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: '1'
              type:
                type: string
                example: customer
              attributes:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  enterprise_id:
                    type: integer
                    example: 2
                  first_name:
                    type: string
                    nullable: true
                    example: Alice
                  last_name:
                    type: string
                    nullable: true
                    example: Springs
                  code:
                    type: string
                    nullable: true
                    example: BUYER1
                  email:
                    type: string
                    example: alice@example.com
                  allow_charges:
                    type: boolean
                    example: false
                  tags:
                    type: array
                    items:
                      type: string
                    example:
                    - staff
                    - discount
                  terms_and_conditions_accepted_at:
                    type: string
                    format: date-time
                    nullable: true
                    example: '2022-03-12T15:55:00.000+11:00'
                  billing_address:
                    type: object
                    nullable: true
                    example:
                  shipping_address:
                    type: object
                    nullable: true
                    example:
                      phone: 0404 333 222 111
                      latitude: -37.8173751
                      longitude: 144.964803195704
                      first_name: Alice
                      last_name: Springs
                      street_address_1: 1 Flinders Street
                      street_address_2: ''
                      postal_code: '1234'
                      locality: Melbourne
                      region:
                        code: Vic
                        name: Victoria
                      country:
                        code: AU
                        name: Australia
                  balance:
                    type: number
                    format: double
                required:
                - id
                - enterprise_id
                - first_name
                - last_name
                - code
                - email
                - allow_charges
                - tags
                - terms_and_conditions_accepted_at
                - billing_address
                - shipping_address
              relationships:
                type: object
                properties:
                  enterprise:
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          type:
                            type: string
                            example: enterprise
                      links:
                        type: object
                        properties:
                          related:
                            type: string
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                results:
                  type: integer
                  example: 250
                pages:
                  type: integer
                  example: 5
                page:
                  type: integer
                  example: 2
                per_page:
                  type: integer
                  example: 50
          required:
          - pagination
        links:
          type: object
          properties:
            self:
              type: string
            first:
              type: string
            prev:
              type: string
              nullable: true
            next:
              type: string
              nullable: true
            last:
              type: string
      required:
      - data
      - meta
      - links
    customer_account_transaction:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
              example: '1'
            type:
              type: string
              example: customer_account_transaction
            attributes:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                customer_id:
                  type: integer
                  example: 10
                amount:
                  type: decimal
                  example: 10.5
                currency:
                  type: string
                  example: AUD
                description:
                  type: string
                  nullable: true
                  example: Payment processed by POS
                balance:
                  type: decimal
                  example: 10.5
              required:
              - id
              - customer_id
              - amount
              - currency
              - description
              - balance
            relationships:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          example: customer
                    links:
                      type: object
                      properties:
                        related:
                          type: string
        meta:
          type: object
        links:
          type: object
      required:
      - data
  securitySchemes:
    api_key_header:
      type: apiKey
      name: X-Api-Token
      in: header
      description: Authenticates via API key passed in specified header
    api_key_param:
      type: apiKey
      name: token
      in: query
      description: Authenticates via API key passed in specified query param
    session:
      type: apiKey
      name: _ofn_session_id
      in: cookie
      description: Authenticates using the current user's session if logged in
paths:
  "/api/v1/customer_account_transaction":
    post:
      summary: Create customer transaction
      tags:
      - Customer account transaction
      parameters: []
      responses:
        '201':
          description: Customer transaction created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/customer_account_transaction"
        '422':
          description: Missing required parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: Invalid customer ID
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                  example: 10
                amount:
                  type: decimal
                  example: 10.5
                description:
                  type: string
                  nullable: true
                  example: Payment processed by POS
              required:
              - customer_id
              - amount
  "/api/v1/customers":
    get:
      summary: List customers
      tags:
      - Customers
      parameters:
      - name: enterprise_id
        in: query
        schema:
          type: string
      - name: extra_fields[customer]
        in: query
        example: balance
        description: Add extra fields to each customer
        schema:
          type: string
      responses:
        '200':
          description: Customers list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/customers_collection"
    post:
      summary: Create customer
      tags:
      - Customers
      parameters: []
      responses:
        '201':
          description: Example customer created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/customer"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enterprise_id:
                  type: integer
                  example: 2
                first_name:
                  type: string
                  nullable: true
                  example: Alice
                last_name:
                  type: string
                  nullable: true
                  example: Springs
                code:
                  type: string
                  nullable: true
                  example: BUYER1
                email:
                  type: string
                  example: alice@example.com
                tags:
                  type: array
                  items:
                    type: string
                  example:
                  - staff
                  - discount
                billing_address:
                  type: object
                  nullable: true
                  example:
                shipping_address:
                  type: object
                  nullable: true
                  example:
                    phone: 0404 333 222 111
                    latitude: -37.8173751
                    longitude: 144.964803195704
                    first_name: Alice
                    last_name: Springs
                    street_address_1: 1 Flinders Street
                    street_address_2: ''
                    postal_code: '1234'
                    locality: Melbourne
                    region:
                      code: Vic
                      name: Victoria
                    country:
                      code: AU
                      name: Australia
              required:
              - enterprise_id
              - email
  "/api/v1/customers/{id}":
    get:
      summary: Show customer
      tags:
      - Customers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: '1'
                      type:
                        type: string
                        example: customer
                      attributes:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          enterprise_id:
                            type: integer
                            example: 2
                          first_name:
                            type: string
                            nullable: true
                            example: Alice
                          last_name:
                            type: string
                            nullable: true
                            example: Springs
                          code:
                            type: string
                            nullable: true
                            example: BUYER1
                          email:
                            type: string
                            example: alice@example.com
                          allow_charges:
                            type: boolean
                            example: false
                          tags:
                            type: array
                            items:
                              type: string
                            example:
                            - staff
                            - discount
                          terms_and_conditions_accepted_at:
                            type: string
                            format: date-time
                            nullable: true
                            example: '2022-03-12T15:55:00.000+11:00'
                          billing_address:
                            type: object
                            nullable: true
                            example:
                          shipping_address:
                            type: object
                            nullable: true
                            example:
                              phone: 0404 333 222 111
                              latitude: -37.8173751
                              longitude: 144.964803195704
                              first_name: Alice
                              last_name: Springs
                              street_address_1: 1 Flinders Street
                              street_address_2: ''
                              postal_code: '1234'
                              locality: Melbourne
                              region:
                                code: Vic
                                name: Victoria
                              country:
                                code: AU
                                name: Australia
                          balance:
                            type: number
                            format: double
                        required:
                        - id
                        - enterprise_id
                        - first_name
                        - last_name
                        - code
                        - email
                        - allow_charges
                        - tags
                        - terms_and_conditions_accepted_at
                        - billing_address
                        - shipping_address
                        - balance
                      relationships:
                        type: object
                        properties:
                          enterprise:
                            type: object
                            properties:
                              data:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                    example: enterprise
                              links:
                                type: object
                                properties:
                                  related:
                                    type: string
                  meta:
                    type: object
                  links:
                    type: object
                required:
                - data
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
    put:
      summary: Update customer
      tags:
      - Customers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/customer"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  nullable: true
                  example: Alice
                last_name:
                  type: string
                  nullable: true
                  example: Springs
                code:
                  type: string
                  nullable: true
                  example: BUYER1
                email:
                  type: string
                  example: alice@example.com
                tags:
                  type: array
                  items:
                    type: string
                  example:
                  - staff
                  - discount
                billing_address:
                  type: object
                  nullable: true
                  example:
                shipping_address:
                  type: object
                  nullable: true
                  example:
                    phone: 0404 333 222 111
                    latitude: -37.8173751
                    longitude: 144.964803195704
                    first_name: Alice
                    last_name: Springs
                    street_address_1: 1 Flinders Street
                    street_address_2: ''
                    postal_code: '1234'
                    locality: Melbourne
                    region:
                      code: Vic
                      name: Victoria
                    country:
                      code: AU
                      name: Australia
              required:
              - enterprise_id
              - email
    delete:
      summary: Delete customer
      tags:
      - Customers
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customer deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/customer"
  "/api/v1/enterprises/{enterprise_id}/customers":
    get:
      summary: List customers of an enterprise
      tags:
      - Customers
      - Enterprises
      parameters:
      - name: enterprise_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customers list
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/customers_collection"
  "/api/v1/reports/{report_type}":
    get:
      summary: Retrieve report rows
      tags:
      - Reports
      security:
      - api_key_header: []
      - api_key_param: []
      - session: []
      description: |
        Returns report rows using the current user's existing report permissions.

        Supply at least one of order_cycle_id or distributor_id. When both are
        supplied, both filters apply. The selected report determines the row
        fields, available subtypes and visibility rules.

        Pagination is applied after generating the complete report, preserving
        its grouping and calculations. It limits the response size, not the
        work needed to generate the report.
      parameters:
      - name: report_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - packing
          - customers
          - order_cycle_management
          - xero_invoices
          - products_and_inventory
          - enterprise_fee_summary
          - orders_and_distributors
          - orders_and_fulfillment
          - sales_tax
          - payments
          - suppliers
          - bulk_coop
          - revenues_by_hub
      - name: report_subtype
        in: query
        required: false
        schema:
          type: string
        description: A subtype supported by the selected report. Defaults to that
          report's first subtype.
      - name: order_cycle_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Restricts results to an order cycle. Required unless distributor_id
          is supplied.
      - name: distributor_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Restricts results to a distributing enterprise. Required unless
          order_cycle_id is supplied.
      - name: q[completed_at_gt]
        in: query
        required: false
        schema:
          type: string
        description: Lower completion-date filter, for example 2026-10-01. Uses the
          selected report's date handling; does not filter products_and_inventory.
      - name: q[completed_at_lt]
        in: query
        required: false
        schema:
          type: string
        description: Upper completion-date filter, for example 2026-11-01. Uses the
          selected report's date handling; does not filter products_and_inventory.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page of report rows.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        description: Rows per page. Values above 200 are capped at 200.
      responses:
        '200':
          description: Report rows, including an empty result
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                - links
                properties:
                  data:
                    type: array
                    description: Row fields vary by report and subtype.
                    items:
                      type: object
                      additionalProperties: true
                  meta:
                    type: object
                    required:
                    - pagination
                    properties:
                      pagination:
                        type: object
                        required:
                        - results
                        - pages
                        - page
                        - per_page
                        properties:
                          results:
                            type: integer
                            minimum: 0
                          pages:
                            type: integer
                            minimum: 1
                          page:
                            type: integer
                            minimum: 1
                          per_page:
                            type: integer
                            minimum: 1
                            maximum: 200
                  links:
                    type: object
                    required:
                    - self
                    - first
                    - prev
                    - next
                    - last
                    properties:
                      self:
                        type: string
                      first:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                      last:
                        type: string
        '401':
          description: Missing or invalid authentication, or no report permission
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '403':
          description: The enterprise fee report rejects access to a requested filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '404':
          description: An order cycle or distributor does not exist
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
        '422':
          description: Invalid report, subtype, filters or pagination
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_response"
servers:
- url: "/"
